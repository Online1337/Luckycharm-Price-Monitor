name: LuckyCharmGold Price Monitor

on:
  schedule:
    # Run at :07 and :37 every hour = every 30 minutes.
    - cron: "7,22,37,52 * * * *"

  # Also gives us a button to test the monitor manually.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: luckycharm-price-monitor
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check LuckyCharmGold price
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node monitor.mjs

      - name: Upload debug screenshot if monitor failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luckycharm-debug
          path: debug.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Monthly keepalive
        if: success()
        shell: bash
        run: |
          MONTH="$(date -u +'%Y-%m')"

          if [ ! -f heartbeat.txt ] || [ "$(cat heartbeat.txt)" != "$MONTH" ]; then
            echo "$MONTH" > heartbeat.txt
          fi

      - name: Save latest price
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json heartbeat.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update price monitor state"
            git push
          fi
